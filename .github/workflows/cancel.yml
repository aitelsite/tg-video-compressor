name: Cancel Telegram video
run-name: cancel-${{ github.event.client_payload.chat_id }}-${{ github.event.client_payload.message_id }}

on:
  repository_dispatch:
    types: [cancel]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel matching compression request
        uses: actions/github-script@v7
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          STATUS_MESSAGE_ID: ${{ github.event.client_payload.status_message_id }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        with:
          script: |
            const chatId = String(process.env.CHAT_ID || "");
            const messageId = String(process.env.MESSAGE_ID || "");
            const statusMessageId = Number(process.env.STATUS_MESSAGE_ID || 0);
            const targetName = "compress-" + chatId + "-" + messageId;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function updateTelegram(text) {
              if (!process.env.BOT_TOKEN || !chatId || !statusMessageId) return;
              try {
                const response = await fetch(
                  "https://api.telegram.org/bot" + process.env.BOT_TOKEN + "/editMessageText",
                  {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({
                      chat_id: Number(chatId),
                      message_id: statusMessageId,
                      text,
                      reply_markup: { inline_keyboard: [] }
                    })
                  }
                );
                if (!response.ok) core.warning("Could not update the Telegram status message.");
              } catch {
                core.warning("Could not update the Telegram status message.");
              }
            }

            if (!chatId || !messageId || !statusMessageId) {
              core.warning("Cancellation payload is incomplete.");
              return;
            }

            let targetRun = null;
            let existingRun = null;
            for (let attempt = 0; attempt < 10; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, event: "repository_dispatch", per_page: 100
              });
              existingRun = data.workflow_runs.find(run => run.display_title === targetName);
              targetRun = data.workflow_runs.find(run =>
                run.display_title === targetName && run.status !== "completed"
              );
              if (targetRun || existingRun) break;
              await new Promise(resolve => setTimeout(resolve, 1500));
            }

            if (!targetRun) {
              await updateTelegram(existingRun
                ? "ℹ️ این درخواست قبلاً پایان یافته است."
                : "⚠️ درخواست فعالی برای لغو پیدا نشد.");
              return;
            }

            try {
              await github.rest.actions.cancelWorkflowRun({
                owner, repo, run_id: targetRun.id
              });
            } catch {
              await updateTelegram("⚠️ لغو درخواست از طرف GitHub انجام نشد؛ دوباره تلاش کنید.");
              core.warning("GitHub did not accept the cancellation request.");
              return;
            }

            let finalText = "⏳ درخواست لغو ثبت شد؛ پردازش در حال توقف است.";
            for (let attempt = 0; attempt < 8; attempt++) {
              const { data } = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: targetRun.id
              });
              if (data.status === "completed") {
                if (data.conclusion === "cancelled") {
                  finalText = "❌ درخواست ویدیو با موفقیت لغو شد.";
                } else if (data.conclusion === "success") {
                  finalText = "ℹ️ ویدیو پیش از تکمیل لغو آماده شده است.";
                } else {
                  finalText = "⚠️ درخواست پایان یافته است؛ وضعیت: " + String(data.conclusion || "نامشخص");
                }
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            await updateTelegram(finalText);
