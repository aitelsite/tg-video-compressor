name: Validate Telegram API credential format
run-name: validate-telegram-api-credential-format

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate API_ID and API_HASH without exposing values
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          raw_id = os.environ.get("API_ID")
          raw_hash = os.environ.get("API_HASH")

          if raw_id is None or not raw_id.strip():
              print("API_ID_PRESENT: false")
              sys.exit("API_ID is missing or empty")
          print("API_ID_PRESENT: true")
          print("API_ID_HAS_SURROUNDING_WHITESPACE:", raw_id != raw_id.strip())

          try:
              api_id = int(raw_id.strip())
              print("API_ID_IS_INTEGER: true")
              print("API_ID_IS_POSITIVE:", api_id > 0)
          except ValueError:
              print("API_ID_IS_INTEGER: false")
              sys.exit("API_ID must be an integer")

          if raw_hash is None or not raw_hash:
              print("API_HASH_PRESENT: false")
              sys.exit("API_HASH is missing or empty")
          print("API_HASH_PRESENT: true")
          print("API_HASH_LENGTH_VALID:", len(raw_hash) == 32)
          print("API_HASH_HEX_VALID:", bool(re.fullmatch(r"[0-9a-fA-F]{32}", raw_hash)))
          print("API_HASH_HAS_WHITESPACE:", any(ch.isspace() for ch in raw_hash))

          if len(raw_hash) != 32 or not re.fullmatch(r"[0-9a-fA-F]{32}", raw_hash):
              sys.exit("API_HASH format is not a 32-character hexadecimal value")
          if api_id <= 0:
              sys.exit("API_ID must be positive")
          if raw_id != raw_id.strip() or any(ch.isspace() for ch in raw_hash):
              sys.exit("Credential values contain whitespace; no values were printed")
          print("CREDENTIAL_FORMAT_CHECK: passed")
          PY
