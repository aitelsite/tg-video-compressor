name: Compress Telegram video

on:
  repository_dispatch:
    types: [compress]

permissions:
  contents: read

concurrency:
  group: video-${{ github.event.client_payload.chat_id }}
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          df -h /
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Process video
        env:
          CHAT: ${{ github.event.client_payload.chat_id }}
          MSG: ${{ github.event.client_payload.message_id }}
          URL: ${{ github.event.client_payload.url }}
          HEIGHT: ${{ github.event.client_payload.height }}
          SMALL: ${{ github.event.client_payload.small }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python compress.py
