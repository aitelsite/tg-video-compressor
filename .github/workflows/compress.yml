name: Compress Telegram video

on:
  repository_dispatch:
    types: [compress]

permissions:
  contents: read

# Keep every request for this chat instead of replacing an older pending request.
# GitHub allows up to 100 pending runs per concurrency group with queue: max.
concurrency:
  group: video-${{ github.event.client_payload.chat_id }}
  queue: max
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check or install FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg is already available; skipping installation."
          else
            echo "FFmpeg is missing; installing it now."
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          df -h /
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Process video
        env:
          CHAT: ${{ github.event.client_payload.chat_id }}
          MSG: ${{ github.event.client_payload.message_id }}
          URL: ${{ github.event.client_payload.url }}
          HEIGHT: ${{ github.event.client_payload.height }}
          SMALL: ${{ github.event.client_payload.small }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python compress.py
